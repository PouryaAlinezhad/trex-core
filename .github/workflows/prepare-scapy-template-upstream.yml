name: Prepare Scapy template serialization upstream branch

on:
  push:
    branches:
      - automation/prepare-scapy-template-upstream
    paths:
      - .github/workflows/prepare-scapy-template-upstream.yml

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source and regression-test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          service_path = Path("scripts/automation/trex_control_plane/interactive/trex/scapy_server/scapy_service.py")
          test_path = Path("scripts/automation/trex_control_plane/interactive/trex/scapy_server/unit_tests/test_scapy_service.py")
          workflow_path = Path(".github/workflows/prepare-scapy-template-upstream.yml")

          service = service_path.read_text(encoding="utf-8")
          old_line = "            content = base64.b64encode(str_to_bytes(content_file.read()))"
          new_line = "            content = bytes_to_b64(str_to_bytes(content_file.read()))"
          if service.count(old_line) != 1:
              raise SystemExit(f"Expected exactly one legacy get_template line, found {service.count(old_line)}")
          service_path.write_text(service.replace(old_line, new_line, 1), encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          anchor = "def test_get_template_root():\n"
          regression_test = '''def test_get_template_returns_json_serializable_string():
              params = {"id": "TCP-SYN"}
              template_b64 = service.get_template(v_handler, params)

              assert isinstance(template_b64, str)
              json.dumps(template_b64)

              template_json = base64.b64decode(template_b64).decode("utf-8")
              obj = json.loads(template_json)
              assert obj["packet"][0]["id"] == "Ether"

          '''
          if regression_test in tests:
              raise SystemExit("Regression test already exists")
          if tests.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one template test insertion point, found {tests.count(anchor)}")
          test_path.write_text(tests.replace(anchor, regression_test + anchor, 1), encoding="utf-8")

          ast.parse(service_path.read_text(encoding="utf-8"), filename=str(service_path))
          ast.parse(test_path.read_text(encoding="utf-8"), filename=str(test_path))
          workflow_path.unlink()
          PY

      - name: Verify focused final diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'scripts/automation/trex_control_plane/interactive/trex/scapy_server/scapy_service.py\nscripts/automation/trex_control_plane/interactive/trex/scapy_server/unit_tests/test_scapy_service.py'
          git diff -- scripts/automation/trex_control_plane/interactive/trex/scapy_server/scapy_service.py
          git diff -- scripts/automation/trex_control_plane/interactive/trex/scapy_server/unit_tests/test_scapy_service.py

      - name: Commit prepared change
        shell: bash
        run: |
          git config user.name "Pourya Alinezhad"
          git config user.email "95608426+PouryaAlinezhad@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Scapy template serialization fix for upstream

          Apply the JSON-safe Base64 return and its regression test on current Cisco master.

          Signed-off-by: Pourya Alinezhad <95608426+PouryaAlinezhad@users.noreply.github.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
